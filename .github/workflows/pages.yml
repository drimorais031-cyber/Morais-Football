name: Publish Morais Football V1.0
on:
  push:
    branches: [v1-modular-3d]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v1
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript modules
        run: |
          node --check src/main.js
          node --check src/scene.js
          node --check src/physics.js
          node --check src/controls.js
          node --check src/ai.js
          node --check src/match.js
      - name: Publish website to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          force_orphan: true
          exclude_assets: '.github,android,node_modules,README.md,package-lock.json'
