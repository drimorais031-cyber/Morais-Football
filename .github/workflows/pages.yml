name: Deploy Morais Football V1.0 to GitHub Pages
on:
  push:
    branches: [main, v1-modular-3d]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ES modules
        run: |
          node --check src/main.js
          node --check src/scene.js
          node --check src/physics.js
          node --check src/controls.js
          node --check src/ai.js
          node --check src/match.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
