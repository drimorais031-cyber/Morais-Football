name: Build Morais Football V1.0 APK
on:
  workflow_dispatch:
  push:
    branches: [main, v1-modular-3d]
    paths:
      - 'index.html'
      - 'style.css'
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate and prepare web assets
        run: |
          for f in src/*.js; do node --check "$f"; done
          mkdir -p www
          cp index.html style.css www/
          cp -r src www/src
      - name: Install Capacitor and generate Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Force landscape orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s,n=re.subn(r'(<activity[^>]*android:name="[^"]*MainActivity"[^>]*)>',r'\1 android:screenOrientation="landscape">',s,count=1)
          if n != 1:
              raise SystemExit('Não foi possível configurar a orientação horizontal.')
          p.write_text(s)
          PY
      - name: Generate Android adaptive and legacy launcher icons
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter
          import base64, re, io
          source=Path('src/brand.js').read_text()
          encoded=re.search(r'base64,([^\\" ]+)', source).group(1)
          original=Image.open(io.BytesIO(base64.b64decode(encoded))).convert('RGBA')
          # Preserve the complete artwork, sharpen it, and keep it inside Android's adaptive-icon safe zone.
          side=min(original.size)
          left=(original.width-side)//2
          top=(original.height-side)//2
          artwork=original.crop((left,top,left+side,top+side))
          artwork=artwork.filter(ImageFilter.UnsharpMask(radius=2,percent=150,threshold=3))
          foreground=Image.new('RGBA',(432,432),(0,0,0,0))
          artwork.thumbnail((300,300),Image.Resampling.LANCZOS)
          foreground.alpha_composite(artwork,((432-artwork.width)//2,(432-artwork.height)//2))
          base=Path('android/app/src/main/res')
          (base/'mipmap-anydpi-v26').mkdir(parents=True,exist_ok=True)
          (base/'drawable-nodpi').mkdir(parents=True,exist_ok=True)
          (base/'values').mkdir(parents=True,exist_ok=True)
          foreground.save(base/'drawable-nodpi/mf_launcher_foreground.png')
          (base/'values/ic_launcher_background.xml').write_text('''<resources><color name="ic_launcher_background">#07152B</color></resources>''')
          for name in ('ic_launcher','ic_launcher_round'):
              (base/f'mipmap-anydpi-v26/{name}.xml').write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/mf_launcher_foreground"/></adaptive-icon>''')
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder=base/f'mipmap-{density}'
              folder.mkdir(parents=True,exist_ok=True)
              icon=artwork.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(folder/'ic_launcher.png')
              mask=Image.new('L',(size,size),0)
              ImageDraw.Draw(mask).ellipse((0,0,size-1,size-1),fill=255)
              round_icon=icon.copy()
              round_icon.putalpha(mask)
              round_icon.save(folder/'ic_launcher_round.png')
          print('Adaptive icon XML and legacy launcher PNGs generated.')
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Morais-Football-V1.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
